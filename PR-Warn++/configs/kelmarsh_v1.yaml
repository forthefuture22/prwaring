# Kelmarsh wind-farm configuration (second external dataset for C0-1 / C3-1).
# Data source: Plumley, C. Kelmarsh Wind Farm Data v0.0.3, Zenodo record 5841834
#   (concept DOI 10.5281/zenodo.5841833), license CC-BY-4.0.
#   6 x Senvion MM92 turbines, 10-minute resolution, no published pitch/nacelle
#   angle, ambient wind direction in global (mast) frame.
# Preprocess with: python -m prwarn.cli.preprocess_kelmarsh --input <csv> \
#   --output-dir data/processed/kelmarsh --rated-power 12.3 \
#   --features <published columns> ...
# Split/window protocol is identical to sdwpf_v3_2.yaml so that within-farm
# retraining is comparable across farms (same ratios, history/forecast horizon).
experiment:
  name: kelmarsh_v1_history_only
  seed: 2025
  seeds: [2025, 2026, 2027, 2028, 2029]

data:
  dataset: kelmarsh_v1
  dataset_license: CC-BY-4.0
  dataset_origin_url: https://zenodo.org/record/5841834
  reason_code_strategy: generic_scada
  resolution_minutes: 10
  history_steps: 24
  forecast_steps: 6
  weather_protocol: history_only
  weather_minimum_coverage: 0.95
  split:
    train: 0.60
    val: 0.15
    calib: 0.10
    test: 0.15
  wind_direction_mode: global
  feature_columns: [Wind Speed, Wind Direction, Active Power, Ambient Temp, Nacelle Temp, Gearbox Bearing Temp]
  target_column: Active Power
  pressure_column: null          # Kelmarsh publishes no pressure channel; density correction off
  temperature_column: Ambient Temp
  availability:
    history_scada: observed_at_or_before_origin
    historical_era5: observed_at_or_before_origin
    future_era5: oracle_only
    future_issue_time_nwp: unavailable_until_archive_added

physics:
  reference_density_kg_m3: 1.225
  power_curve_bins: 50
  minimum_bin_count: 20

graphs:
  enabled: [geo, corr, directional, adaptive]
  geographic_k: 8
  correlation_k: 12
  correlation_mode: difference
  direction_distance_scale: 1000.0
  direction_sigma_degrees: 30.0
  direction_sector_degrees: 90.0
  wind_direction_mode: global          # Kelmarsh 无 nacelle 角，使用全局（桅杆）风向
  wind_direction_feature: "Wind Direction"
  nacelle_direction_feature: null

model:
  architecture: multigraph
  target_mode: physics_residual
  hidden_dim: 64
  temporal_kernel: 3
  dropout: 0.1
  missing_inputs: [mask, delta_t]
  point_loss: masked_huber
  huber_delta_fraction: 0.05

flow:
  hidden_dim: 128
  prior: gaussian
  coupling: independent
  solver: euler
  steps: 8
  scenarios_eval: 100

generative_baselines:
  hidden_dim: 128
  graph_layers: 2
  cvae:
    latent_dim: 16
    beta: 0.001
  vae_cfm:
    latent_dim: 16
    beta: 0.001
    flow_weight: 1.0
    sampling_steps: 8
  ddim:
    diffusion_steps: 100
    sampling_steps: 20
    eta: 0.0

calibration:
  primary: split_per_horizon
  alpha: 0.10
  aggregate_level: farm
  aci_gamma: 0.01
  aci_rolling_window: null
  context_neighbors: 100
  context_ood_quantile: 0.95

risk:
  auxiliary_terms: [ood, data_quality]
  auxiliary_weights:
    ood: 0.25
    data_quality: 0.25
  false_negative_cost: 5.0
  false_positive_cost: 1.0
  ramp_durations_steps: [1, 3, 6]
  ramp_threshold_fractions: [0.05, 0.10, 0.20]
  cvar_levels: [0.90, 0.95, 0.99]
