<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill: #0F172A; }
      .panelTitle { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #FFFFFF; }
      .panelSub { font-family: Arial, sans-serif; font-size: 15px; font-weight: normal; fill: #E2E8F0; }
      .panelSubSmall { font-family: Arial, sans-serif; font-size: 13px; font-weight: normal; fill: #E2E8F0; }
      .boxTitle { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #0F172A; }
      .body { font-family: Arial, sans-serif; font-size: 15px; font-weight: normal; fill: #334155; }
      .small { font-family: Arial, sans-serif; font-size: 13px; font-weight: normal; fill: #475569; }
      .formula { font-family: 'Times New Roman', serif; font-size: 16px; font-weight: bold; fill: #0F172A; }
      .tag { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #FFFFFF; }
      .solid { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748B; stroke-width: 2.4; stroke-dasharray: 9 7; marker-end: url(#arrow); }
      .dot { fill: none; stroke: #A16207; stroke-width: 2.4; stroke-dasharray: 2 7; marker-end: url(#arrow); stroke-linecap: round; }
      .graydash { fill: none; stroke: #94A3B8; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrowGray); }
    </style>
  </defs>

  <rect width="1600" height="700" fill="#FFFFFF"/>
  <text x="42" y="43" class="title">PR-Warn++ v3.2: availability-aware joint wind-power forecasting and risk assessment</text>
  <line x1="42" y1="62" x2="1558" y2="62" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Legend -->
  <line x1="1080" y1="35" x2="1120" y2="35" class="solid"/>
  <text x="1128" y="40" class="small">online inference</text>
  <line x1="1260" y1="35" x2="1300" y2="35" class="dash"/>
  <text x="1308" y="40" class="small">training target</text>
  <line x1="1435" y1="35" x2="1475" y2="35" class="dot"/>
  <text x="1483" y="40" class="small">Calib-only</text>

  <!-- Panel backgrounds -->
  <rect x="35" y="90" width="350" height="520" rx="14" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="2"/>
  <rect x="35" y="90" width="350" height="66" rx="14" fill="#0F766E"/>
  <rect x="35" y="141" width="350" height="15" fill="#0F766E"/>
  <text x="55" y="119" class="panelTitle">A  Availability-aware inputs</text>
  <text x="55" y="142" class="panelSubSmall">Solid path: available by forecast origin t</text>

  <rect x="405" y="90" width="380" height="520" rx="14" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
  <rect x="405" y="90" width="380" height="66" rx="14" fill="#15803D"/>
  <rect x="405" y="141" width="380" height="15" fill="#15803D"/>
  <text x="425" y="119" class="panelTitle">B  Weak-physics deterministic center</text>
  <text x="425" y="142" class="panelSub">Temporal convolutions + residual graph blocks</text>

  <rect x="805" y="90" width="390" height="520" rx="14" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="2"/>
  <rect x="805" y="90" width="390" height="66" rx="14" fill="#7E22CE"/>
  <rect x="805" y="141" width="390" height="15" fill="#7E22CE"/>
  <text x="825" y="119" class="panelTitle">C  Direct CFM of final errors</text>
  <text x="825" y="142" class="panelSub">Main method: independent-pair CFM, not VAE/OT</text>

  <rect x="1215" y="90" width="350" height="520" rx="14" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <rect x="1215" y="90" width="350" height="66" rx="14" fill="#C2410C"/>
  <rect x="1215" y="141" width="350" height="15" fill="#C2410C"/>
  <text x="1235" y="119" class="panelTitle">D  Reliability and risk paths</text>
  <text x="1235" y="142" class="panelSub">Three claims, three evaluation objects</text>

  <!-- A: inputs -->
  <rect x="55" y="178" width="140" height="104" rx="10" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/>
  <text x="70" y="205" class="boxTitle">History</text>
  <text x="70" y="229" class="body">SCADA at s &lt;= t</text>
  <text x="70" y="251" class="body">coordinates</text>
  <text x="70" y="273" class="small">no future truth</text>

  <rect x="218" y="178" width="145" height="104" rx="10" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/>
  <text x="233" y="205" class="boxTitle">Rigid grid</text>
  <text x="233" y="229" class="body">valid / unknown</text>
  <text x="233" y="251" class="body">missing / abnormal</text>
  <text x="233" y="273" class="small">reason code = audit</text>
  <path d="M195 230 H214" class="solid"/>
  <polygon points="214,230 203,224 203,236" fill="#334155"/>

  <rect x="55" y="316" width="308" height="112" rx="10" fill="#CCFBF1" stroke="#2DD4BF" stroke-width="2"/>
  <text x="75" y="346" class="boxTitle">Availability representation</text>
  <text x="75" y="374" class="formula">X_fill,  M,  log(1 + Delta t)</text>
  <text x="75" y="400" class="body">tensor: [B, N, L, D]</text>
  <path d="M290 284 V310" class="solid"/>
  <polygon points="290,310 284,299 296,299" fill="#334155"/>

  <rect x="55" y="458" width="308" height="58" rx="9" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="2"/>
  <text x="72" y="483" class="boxTitle">Optional issued weather</text>
  <text x="72" y="505" class="small">as-of join: issue_time &lt;= t (A11 only)</text>
  <path d="M208 428 V452" class="solid"/>
  <polygon points="208,452 202,441 214,441" fill="#334155"/>

  <rect x="55" y="540" width="308" height="48" rx="9" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="72" y="570" class="small">Detached oracle: retrospective future ERA5</text>
  <path d="M208 536 V520" class="graydash"/>
  <polygon points="208,520 202,531 214,531" fill="#94A3B8"/>

  <!-- B: center -->
  <rect x="425" y="178" width="150" height="112" rx="10" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>
  <text x="442" y="205" class="boxTitle">Train-only f_pc</text>
  <path d="M445 269 C465 268, 470 263, 481 254 C493 244, 500 228, 520 224 C535 221, 544 220, 558 220" fill="none" stroke="#16A34A" stroke-width="4"/>
  <text x="442" y="282" class="small">monotone curve</text>

  <rect x="596" y="178" width="169" height="112" rx="10" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>
  <text x="613" y="205" class="boxTitle">Four graph views</text>
  <circle cx="625" cy="238" r="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="619" y="243" class="small">G</text>
  <circle cx="670" cy="238" r="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="664" y="243" class="small">C</text>
  <circle cx="715" cy="238" r="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="709" y="243" class="small">D</text>
  <circle cx="745" cy="271" r="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="739" y="276" class="small">A</text>
  <line x1="639" y1="238" x2="656" y2="238" stroke="#16A34A" stroke-width="2"/>
  <line x1="684" y1="238" x2="701" y2="238" stroke="#16A34A" stroke-width="2"/>
  <line x1="721" y1="250" x2="737" y2="263" stroke="#16A34A" stroke-width="2"/>

  <rect x="425" y="321" width="340" height="112" rx="10" fill="#DCFCE7" stroke="#4ADE80" stroke-width="2"/>
  <text x="445" y="349" class="boxTitle">Gated fusion and residual forecaster</text>
  <text x="445" y="376" class="formula">A_mix = sum_k alpha_k A_k</text>
  <text x="445" y="402" class="body">temporal Conv2d -> graph residual blocks</text>
  <text x="445" y="423" class="small">hidden H_t + residual forecast R_hat</text>
  <path d="M500 291 V315" class="solid"/>
  <path d="M680 291 V315" class="solid"/>
  <polygon points="500,315 494,304 506,304" fill="#334155"/>
  <polygon points="680,315 674,304 686,304" fill="#334155"/>

  <rect x="425" y="466" width="340" height="72" rx="10" fill="#BBF7D0" stroke="#22C55E" stroke-width="2.5"/>
  <text x="445" y="495" class="boxTitle">Deterministic center (RQ1)</text>
  <text x="445" y="523" class="formula">Y_det = clip(P_pc + R_hat)</text>
  <path d="M595 434 V460" class="solid"/>
  <polygon points="595,460 589,449 601,449" fill="#334155"/>

  <rect x="425" y="557" width="340" height="34" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="445" y="580" class="small">Training target only: R = Y - P_pc</text>
  <path d="M595 553 V542" class="dash"/>
  <polygon points="595,542 589,553 601,553" fill="#64748B"/>

  <!-- C: direct CFM -->
  <rect x="825" y="178" width="350" height="66" rx="10" fill="#EDE9FE" stroke="#C084FC" stroke-width="2"/>
  <text x="845" y="205" class="boxTitle">Condition fixed by deterministic stage</text>
  <text x="845" y="229" class="formula">c_t = (H_t, A_mix, runtime context)</text>

  <rect x="825" y="275" width="160" height="182" rx="10" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="839" y="288" width="72" height="23" rx="11" fill="#64748B"/>
  <text x="851" y="304" class="tag">TRAIN</text>
  <text x="842" y="338" class="formula">E = Y - Y_det</text>
  <text x="842" y="366" class="body">z ~ N(0, I)</text>
  <text x="842" y="390" class="body">tau ~ U(0, 1)</text>
  <text x="842" y="414" class="body">linear path E_tau</text>
  <text x="842" y="438" class="small">velocity loss</text>

  <rect x="1002" y="275" width="173" height="182" rx="10" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="2"/>
  <rect x="1016" y="288" width="86" height="23" rx="11" fill="#7E22CE"/>
  <text x="1027" y="304" class="tag">INFER</text>
  <text x="1019" y="338" class="body">M noise fields</text>
  <text x="1019" y="365" class="body">Euler ODE, K steps</text>
  <text x="1019" y="392" class="formula">E^(m)</text>
  <text x="1019" y="420" class="formula">Y^(m)=Y_det+E^(m)</text>
  <text x="1019" y="444" class="small">clip to physical range</text>
  <path d="M1000 245 V267" class="solid"/>
  <path d="M905 245 V267" class="dash"/>
  <polygon points="1000,267 994,256 1006,256" fill="#334155"/>
  <polygon points="905,267 899,256 911,256" fill="#64748B"/>

  <rect x="825" y="486" width="350" height="84" rx="10" fill="#E9D5FF" stroke="#A855F7" stroke-width="2.5"/>
  <text x="845" y="515" class="boxTitle">Coherent joint scenarios (RQ2)</text>
  <text x="845" y="544" class="formula">[M, B, N, H]  ->  farm sum [M, B, H]</text>
  <path d="M1087 458 V480" class="solid"/>
  <polygon points="1087,480 1081,469 1093,469" fill="#334155"/>
  <text x="845" y="563" class="small">A4 VAE-CFM / A5 Hungarian OT = ablations</text>

  <!-- D: outputs -->
  <rect x="1235" y="178" width="310" height="62" rx="10" fill="#FFEDD5" stroke="#FB923C" stroke-width="2"/>
  <text x="1255" y="205" class="boxTitle">Farm-level scenario ensemble</text>
  <text x="1255" y="229" class="formula">P_farm^(m) = sum_i Y_i^(m)</text>

  <rect x="1235" y="268" width="310" height="75" rx="10" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
  <circle cx="1260" cy="291" r="14" fill="#0F766E"/><text x="1254" y="296" class="tag">1</text>
  <text x="1285" y="294" class="boxTitle">Joint scenario fidelity</text>
  <text x="1285" y="321" class="body">Energy / Variogram / dependence</text>

  <rect x="1235" y="363" width="310" height="88" rx="10" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
  <circle cx="1260" cy="387" r="14" fill="#7E22CE"/><text x="1254" y="392" class="tag">2</text>
  <text x="1285" y="390" class="boxTitle">Marginal interval reliability</text>
  <text x="1285" y="417" class="body">farm-level, per horizon</text>
  <text x="1285" y="440" class="small">split conformal: Calib-fit, Test-frozen</text>
  <path d="M1515 240 H1553 V407 H1545" class="dot"/>
  <polygon points="1545,407 1555,401 1555,413" fill="#A16207"/>

  <rect x="1235" y="471" width="310" height="94" rx="10" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
  <circle cx="1260" cy="496" r="14" fill="#C2410C"/><text x="1254" y="501" class="tag">3</text>
  <text x="1285" y="499" class="boxTitle">Event and tail reliability</text>
  <text x="1285" y="526" class="formula">p_ramp, p_dev, CVaR</text>
  <text x="1285" y="550" class="small">Brier / AUPRC / reliability / loss</text>

  <rect x="1235" y="578" width="310" height="22" rx="7" fill="#FED7AA"/>
  <text x="1248" y="594" class="small">A10: frozen OOD/data-quality support</text>

  <!-- One scenario source, three non-sequential evaluation branches -->
  <path d="M1390 240 V254 H1226 V520" fill="none" stroke="#334155" stroke-width="2.4"/>
  <line x1="1226" y1="305" x2="1235" y2="305" stroke="#334155" stroke-width="2.4"/>
  <line x1="1226" y1="407" x2="1235" y2="407" stroke="#334155" stroke-width="2.4"/>
  <line x1="1226" y1="520" x2="1235" y2="520" stroke="#334155" stroke-width="2.4"/>
  <polygon points="1235,305 1225,299 1225,311" fill="#334155"/>
  <polygon points="1235,407 1225,401 1225,413" fill="#334155"/>
  <polygon points="1235,520 1225,514 1225,526" fill="#334155"/>

  <!-- Main inter-panel arrows -->
  <path d="M366 372 H397" class="solid"/>
  <path d="M766 502 H797" class="solid"/>
  <path d="M1176 528 H1207" class="solid"/>
  <polygon points="397,372 386,366 386,378" fill="#334155"/>
  <polygon points="797,502 786,496 786,508" fill="#334155"/>
  <polygon points="1207,528 1196,522 1196,534" fill="#334155"/>

  <!-- Bottom boundary statement -->
  <rect x="35" y="628" width="1530" height="49" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="55" y="650" class="boxTitle">Information boundary:</text>
  <text x="290" y="650" class="body">future Y enters only dashed target construction; Calib labels enter only the dotted calibration path.</text>
  <text x="55" y="671" class="small">Outputs are wind-side predictive proxies - not line-flow, voltage, frequency, reserve, or causal security states.</text>
</svg>
